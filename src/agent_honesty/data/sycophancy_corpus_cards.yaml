    source_title: "Towards Understanding Sycophancy in Language Models"
    source_date: "2024-05-01"
    source_tier: L1
    confidence: confirmed
    category: finding
    contradicted_by: null
    notes: "Sharma et al. ICLR 2024 tested five frontier models on feedback, mathematical verification, and argument generation."
    extracted_date: "2026-09-21"

  - id: "FC-002"
    claim: "Human evaluators and automated preference models systematically prefer sycophantic responses over truthful corrections."
    source_url: "https://proceedings.iclr.cc/paper_files/paper/2024/file/0105f7972202c1d4fb817da9f21a9663-Paper-Conference.pdf"
